<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Creative Developer</title>
    
    <!-- Performance: Preconnect for external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Performance: DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://api.emailjs.com">
    
    <!-- Security Headers (HTTP-only headers removed - should be set server-side) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; connect-src 'self' https://api.emailjs.com;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Additional Security -->
    <meta name="robots" content="index, follow">
    <meta name="author" content="Max Schueller">
    
    <style>
      /* Critical CSS inline for faster first paint */
      body {
        margin: 0;
        padding: 0;
        background-color: #f4e8d0;
        background-image: 
          linear-gradient(135deg, #f4e8d0 0%, #e8dcc0 50%, #dccfb0 100%),
          repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(139, 69, 19, 0.03) 10px, rgba(139, 69, 19, 0.03) 20px),
          repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(139, 69, 19, 0.03) 10px, rgba(139, 69, 19, 0.03) 20px);
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        scroll-behavior: smooth;
      }
      
      * {
        box-sizing: border-box;
      }
      
      html {
        scroll-padding-top: 0px;
      }
      
      /* Loading state styles */
      #root:empty::before {
        content: 'Loading...';
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #8b4513;
        font-family: 'Courier New', monospace;
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
