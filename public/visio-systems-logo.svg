<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <defs>
    <clipPath id="roundedClip">
      <rect width="400" height="400" rx="82" ry="82"/>
    </clipPath>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="400" height="400" rx="82" ry="82" fill="#0d0d0d"/>

  <g clip-path="url(#roundedClip)">

    <!-- V -->
    <text
      x="118" y="278"
      font-family="Arial Black, Arial, sans-serif"
      font-size="210"
      font-weight="900"
      fill="#ffffff"
      text-anchor="middle"
      dominant-baseline="auto"
    >V</text>

    <!-- S -->
    <text
      x="285" y="278"
      font-family="Arial Black, Arial, sans-serif"
      font-size="210"
      font-weight="900"
      fill="#ffffff"
      text-anchor="middle"
      dominant-baseline="auto"
    >S</text>

    <!-- Separator line -->
    <line x1="60" y1="312" x2="340" y2="312" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.25"/>

    <!-- Company name -->
    <text
      x="200" y="340"
      font-family="'Courier New', Courier, monospace"
      font-size="13"
      letter-spacing="7"
      fill="#ffffff"
      fill-opacity="0.6"
      text-anchor="middle"
      dominant-baseline="middle"
    >VISIO SYSTEMS</text>

  </g>
</svg>
